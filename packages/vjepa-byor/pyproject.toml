[project]
name = "vjepa-byor"
version = "0.1.0.dev0"
description = "Bring Your Own Robot: fine-tune V-JEPA 2-AC to predict what your robot's actions will do."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "torch>=2.4",
]

[project.scripts]
vjepa-byor = "vjepa_byor.cli:main"

[project.optional-dependencies]
# Meta's V-JEPA 2-AC model code (loaded through torch.hub) needs these
vjepa = ["einops>=0.7", "timm>=1.0"]
testing = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
