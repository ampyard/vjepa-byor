name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install the packages with CPU-only torch
        # Not `uv sync`: the lockfile has CUDA torch (several GB), and no test here needs a GPU
        run: |
          uv venv
          uv pip install --torch-backend cpu \
            -e "packages/vjepa-byor[testing,ros2]" \
            -e packages/vjepa-byor-esp32-stepper

      - name: Run tests
        # Skipped here by design: the ROS 2 tests (no rclpy; they run in the ROS 2 container,
        # see docker/README.md) and the real-model test (needs CUDA and the V-JEPA weights)
        run: .venv/bin/python -m pytest -ra
